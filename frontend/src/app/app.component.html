<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" routerLink="/">MyWay</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
        </li>
        <!-- Ajouter d'autres liens de navigation ici plus tard -->
      </ul>
      <ul class="navbar-nav ms-auto">
        <!-- Menu utilisateur connecté -->
        <ng-container *ngIf="isLoggedIn">
          <li class="nav-item">
            <a routerLink="/create" class="btn btn-light me-2"><i class="fas fa-plus"></i> Partager un voyage</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              {{ currentUser?.username }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
              <li><a class="dropdown-item" href="javascript:void(0)" (click)="logout()">Déconnexion</a></li>
            </ul>
          </li>
        </ng-container>

        <!-- Menu utilisateur non connecté -->
        <ng-container *ngIf="!isLoggedIn">
          <li class="nav-item">
            <a routerLink="/login" class="btn btn-light me-2">Connexion</a>
          </li>
          <li class="nav-item">
            <a routerLink="/register" class="btn btn-outline-light">Inscription</a>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>

<!-- Contenu principal -->
<main>
  <router-outlet></router-outlet>
</main>

<!-- Pied de page -->
<footer class="footer mt-auto py-3 bg-light">
  <div class="container text-center">
    <span class="text-muted">© 2025 MyWay - Partagez vos voyages</span>
  </div>
</footer>
